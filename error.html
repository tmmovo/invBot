<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Error</title><style>body {font-family: Arial, sans-serif;background-color: white;display: flex;justify-content: center;align-items: center;min-height: 100vh;margin: 0;}.error-box {text-align: center;border: 0.5px solid #ccccccb7;padding: 40px;max-width: 600px;width: 90%;}h1 {font-size: 2.5em;margin: 0 0 20px 0;color: #000;}.code-info {color: #666;margin: 10px 0 30px 0;font-size: 0.9em;}.main-message {font-size: 1.2em;margin: 20px 0;color: #000;}.action {margin: 30px 0 0 0;padding: 20px 0 0 0;border-top: 1px solid #eee;color: #666;font-size: 0.9em;}.footer {margin: 30px 0 0 0;color: #999;font-size: 0.8em;}</style></head><body><div class="error-box"><script>const errorMessages = {"400": "Bad Request","401": "Unauthorized","402": "Payment Required","403": "Forbidden","404": "Not Found","405": "Method Not Allowed","406": "Not Acceptable","407": "Proxy Authentication Required","408": "Request Time-out","409": "Conflict","410": "Gone","411": "Length Required","412": "Precondition Failed","413": "Request Entity Too Large","414": "Request-URI Too Large","415": "Unsupported Media Type","416": "Requested range not satisfiable","417": "Expectation Failed","418": "I'm a teapot","500": "Internal Server Error","502": "Bad Gateway","503": "Service Unavailable","504": "Gateway Time-out","505": "HTTP Version not supported"};try {const urlParams = new URLSearchParams(window.location.search);const code = urlParams.get('code') || "404";const message = errorMessages[code] || "Not Found";document.write(`<h1>${code}: ${message}</h1><div class="action"><div>Site Visitor: Contact the site owner or try again.</div></div><div class="footer">Contaction: <a href="mailto:s@mcdr.top">s@mcdr.top</a></div>`);} catch(e) {document.write(`<h1>404: Not Found</h1><div class="action"><div>Site Visitor: Contact the site owner or try again.</div><div>Site Owner: Please check document or contact us.</div></div><div class="footer">Contaction: <a href="mailto:s@mcdr.top">s@mcdr.top</a></div>`);}</script></div></body></html>
